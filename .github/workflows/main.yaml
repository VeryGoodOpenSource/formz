name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@v2
    with:
      dart_sdk: 3.13.0
      format_directories: "lib test"
      check_ignore: true
      report_on: "lib,test"
      no_example: true

  pana:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/pana.yml@v2
